name: Deploy Testing

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".github/workflows/deploy_production.yaml"

permissions:
  id-token: write # OIDC token
  contents: read

jobs:
  build-and-push:
    runs-on: "arc-${{ matrix.arch }}-2g"
    name: Build & Push to ECR
    environment: testing
    strategy:
      matrix:
        arch: ["amd64", "arm64"]
    outputs:
      image_tag: ${{ steps.short-sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Short SHA
        id: short-sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.arch }}
          context: .
          push: true
          tags: ${{ vars.ECR_REPOSITORY }}:${{ steps.short-sha.outputs.sha }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifest:
    name: Create Multi-Arch Manifest
    needs: ["build-and-push"]
    runs-on: "arc"
    outputs:
      image: ${{ steps.manifest.outputs.image }}
    steps:
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create manifest
        id: manifest
        run: |
          IMAGE="${{ vars.ECR_REPOSITORY }}:${{ needs.build-and-push.outputs.image_tag }}"
          docker buildx imagetools create \
            -t "$IMAGE" \
            "$IMAGE-amd64" \
            "$IMAGE-arm64"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  notify-ops:
    runs-on: "arc"
    needs: ["build-and-push", "manifest"]
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: "ops-tech"

      - name: update internal testing values file
        uses: tvbstw/github-actions/update-kustomize-values-file@main
        with:
          target_repository_token: ${{ steps.app-token.outputs.token }}
          target_repository: tvbstw/ops-tech
          target_file_path: "web-tech/overlays/testing/"
          image_tag: ${{ needs.build-and-push.outputs.image_tag }}
          application: web-tech
          image_repository: ${{ vars.ECR_REPOSITORY }}
          username: ${{ github.actor }}
          useremail: ${{ github.actor }}@users.noreply.github.com
          commit_message: "${{ needs.build-and-push.outputs.image_tag }} released by ${{ github.actor }}"

